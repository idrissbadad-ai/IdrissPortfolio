<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idriss Badad — Portfolio BTS SIO SLAM</title>
<meta name="description" content="Portfolio numérique — profil, formations, expériences et compétences techniques.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profil" id="home">

<a href="#main" class="skip-link">Aller au contenu</a>

<div data-site-nav></div>

<main id="main">

  <!-- PROFIL -->
  <section id="about" class="page-header">
    <div class="wrap">
      <div class="about-grid">
        <div data-photo-container></div>
        <div>
          <span class="section-tag">Mon profil</span>
          <h1 data-full-name>Prénom Nom</h1>
          <p class="lead" data-role>Étudiant BTS SIO — option SLAM</p>
          <p data-about>Présentation à venir.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- FORMATIONS -->
  <section id="formations">
    <div class="wrap">
      <div class="section-head">
        <span class="section-tag">Parcours</span>
        <h2>Formations</h2>
      </div>
      <div class="timeline-list" data-formations></div>
    </div>
  </section>

  <!-- COMPÉTENCES TECHNIQUES -->
  <section id="skills">
    <div class="wrap">
      <div class="section-head">
        <span class="section-tag">Compétences</span>
        <h2>Compétences techniques</h2>
      </div>
      <div class="skills-file">
        <div data-skills></div>
      </div>
    </div>
  </section>

   <!-- VIE ASSOCIATIVE -->
  <section id="vie-associative">
    <div class="wrap">
      <div class="section-head">
        <span class="section-tag">Engagement</span>
        <h2>Vie associative</h2>
      </div>
      <div data-vie-associative></div>
    </div>
  </section>

  <!-- EXPÉRIENCES PROFESSIONNELLES -->
  <section id="experiences">
    <div class="wrap">
      <div class="section-head">
        <span class="section-tag">Parcours</span>
        <h2>Expériences professionnelles</h2>
      </div>
      <div class="timeline-list" data-experiences></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <div class="wrap">
      <div class="section-head">
        <span class="section-tag">Contact</span>
        <h2>Me contacter</h2>
      </div>
      <div class="info-grid" data-contact></div>
    </div>
  </section>

</main>

<div data-site-footer></div>

<script src="js/content.js"></script>
<script src="js/nav.js"></script>
<script src="js/script.js"></script>
</body>
</html>
